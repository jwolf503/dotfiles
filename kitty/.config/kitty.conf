# -------------------------------
# Font & Appearance
# -------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
cursor_shape     beam
cursor_blink_interval 0

# -------------------------------
# Visual Effects
# -------------------------------
background_opacity 0.85
background_blur 25
background_image ~/.config/kitty/background.png
background_image_layout scaled
enable_audio_bell no

# -------------------------------
# Color Theme
# -------------------------------
include ~/.config/kitty/themes/Catppuccin-Macchiato.conf

# -------------------------------
# Scrolling & Scrollback
# -------------------------------
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 3.0
mouse_hide_wait -1

# -------------------------------
# Window & Layout
# -------------------------------
initial_window_width 1200
initial_window_height 750
window_padding_width 10
window_margin_width 5
hide_window_decorations yes
enabled_layouts vertical,horizontal,tall

# -------------------------------
# Tab Bar
# -------------------------------
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge bottom
tab_bar_align left
active_tab_font_style bold
inactive_tab_font_style normal

# -------------------------------
# Keybindings
# -------------------------------
# Window management
map ctrl+shift+enter new_window
map ctrl+shift+[ previous_window
map ctrl+shift+] next_window
map ctrl+shift+w close_window

# Tab management
map ctrl+shift+t new_tab
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+q close_tab

# Layout switching
map ctrl+shift+l next_layout

# Font size
map ctrl+shift+= increase_font_size
map ctrl+shift+- decrease_font_size
map ctrl+shift+backspace restore_font_size

# Fullscreen & config
map ctrl+shift+f11 toggle_fullscreen
map ctrl+shift+e edit_config_file

# Scrolling
map ctrl+shift+h show_scrollback
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down

# Copy/Paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# -------------------------------
# Mouse Behavior
# -------------------------------
# Hide mouse cursor while typing
mouse_hide_wait -1.0

# URL detection and styling
detect_urls yes
url_style curly
url_color #0087bd

# Word selection characters
select_by_word_characters @-./_~?&=%+#

# Click interval (use system default)
click_interval -1.0

# Pointer shapes
default_pointer_shape beam
pointer_shape_when_dragging beam
pointer_shape_when_grabbed arrow

# Copy on select (macOS-friendly)
copy_on_select no

# Mouse click actions
mouse_map left click ungrabbed mouse_click_url_or_select
mouse_map middle release ungrabbed paste_from_selection
mouse_map left press ungrabbed mouse_selection normal
mouse_map left doublepress ungrabbed mouse_selection word
mouse_map left triplepress ungrabbed mouse_selection line
